<!doctype html>
<!--
Social preview for the SignalScout landing page, 1200x630. The same composition as the GitHub social banner of the README (docs/assets/readme/banner-social.png): the brand name on the left, the owl at the centre of its radar on the right, nothing else, so it reads as a small thumbnail in chat and mail apps. No tagline: the tagline travels in the og:description tag.
Render: uvx --from playwright python -I ~/.claude/skills/frontdoor-landing/scripts/shoot.py og landing/source/og.html --out landing/og.png --root landing
Signature: forest #146044, deep #123F36, lime #C9F269, paper #F3F5F1; Bricolage Grotesque 800 and Manrope. Always a still image.
-->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#F3F5F1}svg{display:block}</style></head>
<body>
<svg id="art" width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// Drawn on the 640x320 grid of the README social banner, scaled 1.875x and centred in the taller 1200x630 frame.
var K=1.875,cx=492,cy=160;
function Pt(a,r){return[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)]}
var lit=[[-120,150],[-126,108],[-134,170],[-141,130],[-146,215]].map(function(p){return Pt(p[0],p[1])}).sort(function(a,b){return a[0]-b[0]});
var quiet=[[-118,96],[-131,92],[-138,200],[-147,120],[-125,205],[-143,160],[-122,125],[-148,170],[-114,185]].map(function(p){return Pt(p[0],p[1])});
var a=Pt(-116,520),b=Pt(-149,520),o='';
o+='<defs><linearGradient id="rf" x1="330" x2="400" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient><mask id="rm" maskUnits="userSpaceOnUse" x="-100" y="-100" width="900" height="520"><rect x="-100" y="-100" width="900" height="520" fill="url(#rf)"/></mask></defs>';
o+='<g transform="translate(0 15) scale('+K+')">';
o+='<g mask="url(#rm)">'+[84,132,180,228,276,324,372].map(function(r){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#DCE2DC" stroke-width="2"/>'}).join('')+'</g>';
o+='<path d="M'+cx+' '+cy+' L'+a.join(' ')+' L'+b.join(' ')+'Z" fill="#146044" opacity=".13"/><path d="M'+cx+' '+cy+' L'+a.join(' ')+'" stroke="#146044" stroke-width="2.5" opacity=".7"/>';
o+='<path d="M'+lit.map(function(p){return p.join(' ')}).join(' L')+'" stroke="#146044" stroke-width="2.5" stroke-dasharray="5 5" fill="none"/>';
o+=quiet.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#146044" opacity=".4"/>'}).join('');
o+=lit.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="8" fill="#C9F269" stroke="#146044" stroke-width="2.5"/>'}).join('');
o+='<svg x="'+(cx-66)+'" y="'+(cy-66)+'" width="132" height="132" viewBox="0 0 100 100"><path d="M20 34 L26 8 L42 22 H58 L74 8 L80 34 C88 66 74 94 50 94 C26 94 12 66 20 34Z" fill="#146044"/><path d="M34 70 Q50 78 66 70 M38 80 Q50 86 62 80" stroke="#9FD3B1" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="37" cy="44" r="14" fill="#F3F5F1"/><circle cx="63" cy="44" r="14" fill="#F3F5F1"/><circle cx="37" cy="44" r="8.5" fill="#C9F269"/><circle cx="63" cy="44" r="8.5" fill="#C9F269"/><circle cx="38.5" cy="44" r="4" fill="#0B2A22"/><circle cx="64.5" cy="44" r="4" fill="#0B2A22"/><path d="M45 56 L55 56 L50 64Z" fill="#C9F269"/></svg>';
o+='</g>';
// wordmark: signalsc + lens o + ut, at 109 px, left edge on the 75 px margin (40 px of the 640 grid), clear of every ring
var FS=109,D=FS*.72,g=FS*.0215,BASE=358;
o+='<g style="font:800 '+FS+'px \'Bricolage Grotesque\',Manrope,sans-serif;letter-spacing:-.045em" fill="#123F36"><text id="wl" y="'+BASE+'">signalsc</text><svg id="lens" width="'+D+'" height="'+D+'" viewBox="0 0 78 78"><circle cx="39" cy="39" r="31" fill="none" stroke="#146044" stroke-width="14"/><circle cx="39" cy="39" r="15" fill="#C9F269"/><circle cx="45" cy="33" r="5" fill="#F3F5F1"/></svg><text id="wr" y="'+BASE+'">ut</text></g>';
document.getElementById('art').innerHTML=o;
function lay(){var wl=document.getElementById('wl'),wr=document.getElementById('wr'),l=document.getElementById('lens'),x=75;
wl.setAttribute('x',x);var w1=wl.getComputedTextLength();l.setAttribute('x',x+w1+g);l.setAttribute('y',BASE+FS*.075-D);wr.setAttribute('x',x+w1+g+D+g)}
lay();document.fonts.ready.then(lay);
</script>
</body>
</html>
