<!doctype html>
<!--
SignalScout README illustrations: hero, problem scene, pipeline, postures, social preview.
Signature: shape = geometric owl in flat filled shapes (approved R8D centred badge), lime pupils as the one bright signal, lens o; type = Bricolage Grotesque 800 headings, Manrope body; palette = forest #146044, deep #123F36, lime #C9F269, paper #F3F5F1, detail #0B2A22; ground = paper / deep #0f1f1a; presentation = centred badge, evidence dots on a timeline, cards; voice = patient, sharp, quiet.
Render the stills (not hero, problem and pipeline, which are animated and would be overwritten by a still): uvx --from playwright --with pillow python -I <frontdoor-illustrate>/scripts/render.py docs/assets/readme/source/readme.html --root docs/assets --out docs/assets/readme --items stats,before-after,tech-cta,postures...,nav-*,eng-*   (or render all, then run the animate commands below to put the moving files back)
Then cut the pills free of their frame: uv run --with pillow python -I docs/assets/readme/source/pill.py docs/assets/readme
Social preview (still PNG, upload by hand in Settings, Social preview): render.py ... --items banner-social --themes light
Animated WebP, one per item, from this page (<skill>/frontdoor-readme/scripts/animate.py, run from the repo root):
  hero      uvx --from playwright --with pillow python -I animate.py docs/assets/readme/source/readme.html --root docs/assets --item hero     --call "drawHero({v})"     --motion loop --frames 48 --fps 12 --size 1440x720 --out docs/assets/readme
  pipeline  ... --item pipeline --call "drawPipeline({v})" --motion loop --frames 40 --fps 12 --size 1440x420 --out docs/assets/readme
  problem   ... --item problem  --call "drawProblem({v})"  --motion loop --frames 48 --fps 12 --size 1440x528 --out docs/assets/readme
Motion is slow and small (a sweep turn takes 4 s, a pulse crosses in about 3 s), never flashes, and frame 0 is the still picture. pipeline-still*.webp keep the still pipeline for the landing page under prefers-reduced-motion.
-->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css"><script src="shared.js"></script>
<style>
.pad{padding:40px 48px}
.sub{font:800 34px/1.05 'Bricolage Grotesque';letter-spacing:-.025em;color:var(--forest)}.line{font:500 19px/1.35 Manrope;color:var(--muted)}
.row{display:flex;align-items:center}
.step{flex:1;padding:18px 16px 16px;min-width:0}
.step b{display:block;font:800 21px/1.1 'Bricolage Grotesque';letter-spacing:-.02em;margin:10px 0 6px}
.step p{margin:0;font-size:14.5px;line-height:1.4;color:var(--muted)}
.num{width:30px;height:30px;border-radius:50%;background:var(--forest);color:var(--paper);display:grid;place-items:center;font-weight:800;font-size:14px}
.arrow{flex:none;width:28px;text-align:center;color:var(--forest);font-weight:800;font-size:22px;align-self:center}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:4px 8px;border-radius:99px;background:var(--soft);color:var(--ink);margin:8px 5px 0 0}
.chip.l{background:var(--lime);color:#123F36}
.post{flex:1;padding:24px 24px 22px}
.post .k{font:800 30px/1 'Bricolage Grotesque';letter-spacing:-.02em;margin:14px 0 8px}
.post p{margin:0;font-size:15.5px;line-height:1.45;color:var(--muted)}
</style></head><body><div class="sheet" id="sheet"></div>
<script>
const S=(w,b,vb='0 0 100 100')=>{const[,,vw,vh]=vb.split(' ').map(Number);return `<svg width="${w}" height="${w*vh/vw}" viewBox="${vb}" style="display:block;overflow:visible">${b}</svg>`};
// Approved 4F owl: forest body, belly lines, disc eyes with lime iris and dark pupil, lime beak.
const owl=w=>S(w,`<path d="M20 34 L26 8 L42 22 H58 L74 8 L80 34 C88 66 74 94 50 94 C26 94 12 66 20 34Z" fill="var(--body)"/><path d="M34 70 Q50 78 66 70 M38 80 Q50 86 62 80" stroke="var(--belly)" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="37" cy="44" r="14" fill="var(--disc)"/><circle cx="63" cy="44" r="14" fill="var(--disc)"/><circle cx="37" cy="44" r="8.5" fill="var(--lime)"/><circle cx="63" cy="44" r="8.5" fill="var(--lime)"/><circle cx="38.5" cy="44" r="4" fill="var(--mask)"/><circle cx="64.5" cy="44" r="4" fill="var(--mask)"/><path d="M45 56 L55 56 L50 64Z" fill="var(--lime)"/>`);
// R3-8 lens o: thick ring, lime pupil, one highlight.
const lens=(w,y=0)=>`<svg width="${w}" height="${w}" viewBox="0 0 78 78" style="margin:0 ${w*.03}px;transform:translateY(${y}px);flex:none"><circle cx="39" cy="39" r="31" fill="none" stroke="var(--forest)" stroke-width="14"/><circle cx="39" cy="39" r="15" fill="var(--lime)"/><circle cx="45" cy="33" r="5" fill="var(--disc)"/></svg>`;
const word=px=>`<div class="word" style="font-size:${px}px">signalsc${lens(px*.72,px*.075)}ut</div>`;
const T=(x,y,t,o='')=>`<text x="${x}" y="${y}" font-family="Manrope" font-weight="700" font-size="15" fill="var(--ink)" ${o}>${t}</text>`;

const items=[];
// Hero: centred brand at the centre of a radar; the sweep lights and joins a cluster of evidence dots.
// heroBg(v) draws the radar for one turn position v in 0..1; v=0 is the still picture (wedge from -34deg to -3deg toward the top right, five lime dots lit and joined).
// The animated banner calls drawHero(v) per frame: the sweep makes one full turn, every dot flares as the leading edge passes and fades behind it, the join line marches.
const HERO={H:600,cx:600,cy:177,W:31,// wedge width in degrees
zone:[[900,95,1],[985,42,1],[1060,125,1],[1120,52,1],[1152,138,1],[860,150,0],[960,100,0],[1030,70,0],[1085,20,0],[930,22,0],[1010,160,0],[1110,100,0],[820,110,0],[1150,20,0],[900,170,0],[1070,190,0]],
faint:[[120,90],[200,480],[70,330],[330,560],[1130,520],[900,560],[260,40],[60,560],[420,30],[1060,420]]};
function heroBg(v){const{H,cx,cy,W,zone,faint}=HERO;
const L=-3+360*v;// leading edge of the sweep, degrees, clockwise on screen
const ang=(x,y)=>Math.atan2(y-cy,x-cx)*180/Math.PI;
// 1 while the dot is inside the wedge, then fades over half a turn behind the edge
const glow=(x,y)=>{const age=((((L-ang(x,y))%360)+360)%360)/360,w=W/360;return age<=w?1:Math.max(0,1-(age-w)/.5)};
const rings=[300,420,540,660,780].map(r=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--cardline)" stroke-width="2.5"/>`).join('');
const cross=`<path d="M0 ${cy}H1200M${cx} 0V${H}" stroke="var(--cardline)" stroke-width="1.5" opacity=".6"/>`;
// the owl is the scanner: rings and sweep start at the owl
const P=(a,r)=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
const [x1,y1]=P(L,900),[x2,y2]=P(L-W,900);
const wedge=`<path d="M${cx} ${cy} L${x1} ${y1} L${x2} ${y2}Z" fill="var(--forest)" opacity=".13"/><path d="M${cx} ${cy} L${x1} ${y1}" stroke="var(--forest)" stroke-width="3" opacity=".7"/>`;
const lit=zone.filter(z=>z[2]).sort((a,b)=>a[0]-b[0]);
const gl=lit.map(([x,y])=>glow(x,y)),mean=gl.reduce((s,g)=>s+g,0)/gl.length;
const join=`<path d="M${lit.map(([x,y])=>x+' '+y).join(' L')}" stroke="var(--forest)" stroke-width="3" stroke-dasharray="6 6" stroke-dashoffset="${-144*v}" fill="none" opacity="${(.3+.7*mean).toFixed(3)}"/>`;
// a dim base dot stays; the lit overlay grows and fades with glow
const faintDots=faint.map(([x,y])=>{const g=glow(x,y);return `<circle cx="${x}" cy="${y}" r="4" fill="var(--cardline)"/><circle cx="${x}" cy="${y}" r="${4+3*g}" fill="var(--forest)" opacity="${(.45*g).toFixed(3)}"/>`}).join('');
const zoneDots=zone.map(([x,y,h])=>{const g=glow(x,y);return h
 ?`<circle cx="${x}" cy="${y}" r="5" fill="var(--cardline)"/><circle cx="${x}" cy="${y}" r="${(5+5*g).toFixed(2)}" fill="var(--lime)" stroke="var(--forest)" stroke-width="3" opacity="${g.toFixed(3)}"/>`
 :`<circle cx="${x}" cy="${y}" r="5" fill="var(--forest)" opacity="${(.3+.15*g).toFixed(3)}"/>`}).join('');
return S(1200,`${rings}${cross}${wedge}${faintDots}${join}${zoneDots}`,`0 0 1200 ${H}`)}
function drawHero(v){document.getElementById('hero-bg').innerHTML=heroBg(v)}
{const brand=`<div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">${owl(140)}${word(132)}<div class="sub" style="font-size:50px">Strategic Change Radar</div><div class="line" style="font-size:25px">See the collapse coming. Prove every word of it.</div></div>`;
items.push(['hero',`<div style="height:${HERO.H}px;position:relative;display:flex;align-items:center;justify-content:center"><div data-bleed id="hero-bg" style="position:absolute;inset:0">${heroBg(0)}</div>${brand}</div>`]);}

// Problem scene: Bed Bath & Beyond 2022-2023, separate disclosures joined into one cluster before the filing.
// drawProblem(v) is called per frame by the animated banner: one pulse travels the timeline and lights each disclosure, the cluster join, the alert and the Chapter 11 filing, then the full picture holds. v=0 is the still picture.
const ev=[[90,'Workforce layoffs'],[245,'Dividend pause'],[400,'Debt exchange cancelled'],[555,'Covenant default'],[705,'Financing amendments']];
items.push(['problem',`<div class="pad" style="height:440px"><div class="row" style="justify-content:space-between"><div><div class="tag">Bed Bath &amp; Beyond, Aug 2022 - Apr 2023</div><div class="h" style="margin-top:10px">Each disclosure looks harmless alone.<br>The cluster is the warning.</div></div>${owl(96)}</div>
<div style="margin-top:20px">${S(1104,`<path d="M20 120 H1084" stroke="var(--cardline)" stroke-width="3"/>
<path id="pb-join" d="M90 120 C170 40 320 40 400 96 C480 40 625 40 705 120" stroke="var(--forest)" stroke-width="2.5" fill="none" stroke-dasharray="6 6"/>
${ev.map(([x,t],i)=>`<circle cx="${x}" cy="120" r="10" fill="var(--card)" stroke="var(--cardline)" stroke-width="3"/><circle class="pb-dot" data-x="${x}" cx="${x}" cy="120" r="10" fill="var(--lime)" stroke="var(--forest)" stroke-width="3"/>${T(x,i%2?186:160,t,'text-anchor="middle"')}`).join('')}
<g id="pb-alert"><rect x="842" y="82" width="124" height="76" rx="12" fill="var(--forest)"/><text x="904" y="114" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="21" fill="var(--paper)">Alert</text><text x="904" y="140" text-anchor="middle" font-family="Manrope" font-weight="700" font-size="14" fill="var(--paper)">Jan 2023</text></g>
<g id="pb-gap"><path d="M968 120 H1040" stroke="var(--warn)" stroke-width="3"/><text x="1004" y="108" text-anchor="middle" font-family="Manrope" font-weight="800" font-size="13" fill="var(--warn)">3+ months</text></g>
<circle id="pb-end" cx="1054" cy="120" r="10" fill="var(--warn)"/><circle id="pb-pulse" cx="20" cy="120" r="12" fill="var(--lime)" stroke="var(--forest)" stroke-width="3" opacity="0"/>${T(1084,166,'Chapter 11','text-anchor="end"')}<text x="1084" y="186" text-anchor="end" font-family="Manrope" font-weight="500" font-size="14" fill="var(--muted)">Apr 23, 2023</text>`,'0 0 1104 200')}</div></div>`]);
function drawProblem(v){const $=s=>document.getElementById(s),cl=(a,b,c)=>Math.min(c,Math.max(a,b));
// the finished picture holds, blanks out, one pulse lights it left to right, then it holds again: v=0 and v=1 are the same frame
const A=.12,B=.18,C=.78,D=.88;
const px=v<B?20:v<C?20+(1054-20)*(v-B)/(C-B):1054;
const f=x=>v<A||v>=C?1:v<B?1-(v-A)/(B-A):cl(0,(px-x)/24+.5,1);
document.querySelectorAll('.pb-dot').forEach(d=>d.setAttribute('opacity',f(+d.dataset.x).toFixed(3)));
$('pb-join').setAttribute('opacity',(.25+.75*f(705)).toFixed(3));
$('pb-join').setAttribute('stroke-dashoffset',-120*v);
$('pb-alert').setAttribute('opacity',(.3+.7*f(842)).toFixed(3));
$('pb-gap').setAttribute('opacity',f(968).toFixed(3));
$('pb-end').setAttribute('opacity',(.25+.75*f(1054)).toFixed(3));
const p=$('pb-pulse');p.setAttribute('cx',px);p.setAttribute('opacity',(v<B||v>=D?0:v<C?1:1-(v-C)/(D-C)).toFixed(3))}

// Pipeline: a landscape track of five steps so it stays legible at phone width.
const dark=document.documentElement.dataset.theme==='dark';
const ic=(n,w)=>`<img src="../../icon/${n}${dark?'-dark':''}.svg" width="${w}" height="${w}" style="flex:none;display:block">`;
const st=[['Collect','funnel','untrusted candidates'],['Evidence Gate','shield-check','fail-closed'],['Score in code','gauge','alert at 0.75'],['Challenge','swords','Claude vs GPT'],['Posture','compass','human review']];
// drawPipeline(v) is called per frame by the animated banner: one lime pulse travels the dashed track and each step flares as it passes. v=0 is the still picture.
items.push(['pipeline',`<div class="pad" style="height:350px"><div class="h" style="font-size:30px;margin-bottom:30px">Evidence first, score in code, then a second opinion.</div><div id="pl-track" style="position:relative;display:flex;justify-content:space-between"><div style="position:absolute;left:90px;right:90px;top:52px;border-top:3px dashed var(--cardline)"></div>${st.map((s,i)=>`<div style="position:relative;width:220px;text-align:center;white-space:nowrap"><div class="pl-c" data-end="${i==4?1:0}" style="width:104px;height:104px;margin:0 auto;border-radius:50%;background:var(--card);border:3px solid ${i==4?'var(--lime)':'var(--cardline)'};display:grid;place-items:center">${ic(s[1],58)}</div><div style="font:800 26px/1.1 'Bricolage Grotesque';letter-spacing:-.02em;margin-top:14px">${i+1}. ${s[0]}</div><div style="font-size:17px;font-weight:700;color:var(--muted);margin-top:6px">${s[2]}</div></div>`).join('')}<div id="pl-pulse" style="position:absolute;left:0;top:43px;width:18px;height:18px;border-radius:50%;background:var(--lime);border:3px solid var(--forest);opacity:0"></div></div></div>`]);
function drawPipeline(v){const cs=document.querySelectorAll('.pl-c'),pu=document.getElementById('pl-pulse');
// step centres inside the track box: 110 + 221 i; the pulse enters before the first step and leaves after the last
const a=.1,b=.9,x=-30+(1164+30)*Math.min(1,Math.max(0,(v-a)/(b-a))),on=v>=a&&v<b;
cs.forEach((c,i)=>{const d=Math.abs(x-(110+221*i)),s=on?Math.max(0,1-d/95):0;
c.style.boxShadow=s?`0 0 0 ${(10*s).toFixed(1)}px rgba(201,242,105,${(.6*s).toFixed(3)})`:'none';
c.style.borderColor=s>.35||c.dataset.end==='1'?'var(--lime)':'var(--cardline)';
c.style.transform=`scale(${(1+.07*s).toFixed(3)})`});
pu.style.left=(x-9)+'px';pu.style.opacity=on?(Math.min(1,(v-a)/.04,(b-v)/.04)).toFixed(3):0}

// Postures: one floating card each, from least to most action.
const P=[['posture-maintain','MAINTAIN','Monitor and preserve',1],['posture-adapt','ADAPT','Bounded adjustments',2],['posture-accelerate','ACCELERATE','Capture advantage',3]];
P.forEach(p=>items.push([p[0],`<div style="width:520px;height:300px;padding:40px 40px;background:var(--card)" data-w><div class="row" style="gap:10px">${[1,2,3].map(n=>`<span style="width:56px;height:16px;border-radius:8px;background:${n<=p[3]?'var(--lime)':'var(--soft)'}"></span>`).join('')}</div><div style="font:800 ${p[1].length>8?62:76}px/1 'Bricolage Grotesque';letter-spacing:-.03em;margin:46px 0 18px;color:var(--forest)">${p[1]}</div><div style="font-weight:800;font-size:34px">${p[2]}</div></div>`]));

// Stats strip: only figures the README states elsewhere.
const K=[['3+','months','of warning before the Bed Bath &amp; Beyond Chapter 11 filing'],['0','scores','computed by a model - risk is scored in code'],['2','model families','Claude builds the case, GPT tries to break it'],['$0','when idle','100% serverless, pay only per run']];
items.push(['stats',`<div style="height:230px;padding:34px 40px;display:flex;gap:18px">${K.map((k,i)=>`<div class="card" style="flex:1;padding:24px 22px;${i==0?'background:#146044;border-color:#146044;color:#F3F5F1':''}"><div class="row" style="gap:10px;align-items:baseline"><span style="font:800 64px/1 'Bricolage Grotesque';letter-spacing:-.04em;color:${i==0?'var(--lime)':'var(--forest)'}">${k[0]}</span><span style="font-weight:800;font-size:17px">${k[1]}</span></div><div style="margin-top:12px;font-size:15px;line-height:1.4;${i==0?'':'color:var(--muted)'}">${k[2]}</div></div>`).join('')}</div>`]);

// Before and after: today's manual monitoring against the SignalScout review.
const B=[['Manual searches and spreadsheets','A replayable evidence timeline'],['Disconnected news alerts','One scored cluster per company'],['Subjective analyst judgment','Deterministic score, cited claims'],['Hindsight creeps into the story','Only what was public at that date'],['One model, one blind spot','A cross-model Challenger']];
const x='<svg width="18" height="18" viewBox="0 0 20 20"><path d="M5 5 L15 15 M15 5 L5 15" stroke="var(--warn)" stroke-width="3" stroke-linecap="round"/></svg>',v='<svg width="18" height="18" viewBox="0 0 20 20"><path d="M4 10 L8.5 14.5 L16 6" stroke="#123F36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
items.push(['before-after',`<div class="pad" style="height:390px;display:grid;grid-template-columns:1fr 1fr;gap:22px"><div class="card" style="padding:26px 28px;background:transparent"><div class="tag">Today</div><div class="h" style="font-size:28px;margin:8px 0 18px">Watching counterparties by hand</div>${B.map(b=>`<div class="row" style="gap:12px;margin:12px 0;font-size:17px;color:var(--muted)">${x}${b[0]}</div>`).join('')}</div><div class="card" style="padding:26px 28px;background:#146044;border-color:#146044;color:#F3F5F1"><div class="tag" style="color:var(--lime)">With signalscout</div><div class="h" style="font-size:28px;margin:8px 0 18px">An auditable early-warning radar</div>${B.map(b=>`<div class="row" style="gap:12px;margin:12px 0;font-size:17px;font-weight:700"><span style="width:24px;height:24px;border-radius:50%;background:var(--lime);display:grid;place-items:center;flex:none">${v}</span>${b[1]}</div>`).join('')}</div></div>`]);

// Pills: nav buttons and the engineering contents, each sized to its label; pill.py masks away the frame.
const pill=(id,n,label)=>items.push([id,`<div data-pill style="height:96px;width:max-content;padding:0 40px 0 26px;display:flex;align-items:center;gap:18px;background:var(--card)">${ic(n,56)}<span style="font:800 44px/1 'Bricolage Grotesque';letter-spacing:-.02em;white-space:nowrap">${label}</span></div>`]);
[['nav-video','play','Demo'],['nav-how','flow','How it works'],['nav-architecture','layers','Architecture'],['nav-quickstart','terminal','Quickstart'],['nav-engineering','braces','Engineering'],['nav-iac','cloud-code','IaC diagram'],
['eng-architecture','layers','Architecture'],['eng-reflexion','loop','Reflexion loop'],['eng-scoring','gauge','Scoring'],['eng-evidence','shield-check','Evidence Gate'],['eng-trust','lock','Trust boundaries'],['eng-cost','coin','Cost'],['eng-iac','cloud-code','IaC &amp; DevSecOps'],['eng-invariants','checklist','Invariants'],['eng-quickstart','terminal','Quickstart'],['eng-docs','book','Docs map'],['eng-stack','wrench','Built with']].forEach(a=>pill(...a));

// Tech CTA: invites engineers to the deep-dive file.
const CH=['Deterministic scoring','Evidence Gate','Trust boundaries','Reflexion loop','Infrastructure as Code','Cost levers'];
items.push(['tech-cta',`<div style="height:330px;padding:30px 40px"><div style="height:270px;border-radius:26px;background:#123F36;color:#F3F5F1;display:flex;align-items:center;gap:40px;padding:0 46px;--body:#7fd3a8;--belly:#DAF0E5;--disc:#123F36;--forest:#7fd3a8">${owl(150)}<div style="flex:1;min-width:0"><div class="tag" style="color:#C9F269">For engineers</div><div style="font:800 40px/1.05 'Bricolage Grotesque';letter-spacing:-.03em;margin:10px 0 16px">Go deeper: the engineering<br>behind every alert</div><div>${CH.map(c=>`<span style="display:inline-block;font-size:14px;font-weight:800;padding:6px 12px;border-radius:99px;border:1.5px solid #3f6b5d;margin:0 8px 8px 0">${c}</span>`).join('')}</div></div><div style="flex:none;background:#C9F269;color:#123F36;font:800 20px/1 Manrope;padding:18px 24px;border-radius:99px;white-space:nowrap">Read the tech deep-dive &rarr;</div></div></div>`]);

// GitHub social preview, 640x320 CSS px (1280x640 PNG): the brand name on the left, the owl at the centre of its radar on the right, and nothing else; a tagline cannot be read in a chat thumbnail. Always a still image.
{const W=640,H=320,cx=492,cy=160,Pt=(a,r)=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
// rings fade in from behind the wordmark so no ring crosses a letter
const mask=`<defs><linearGradient id="rf" x1="330" x2="400" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient><mask id="rm" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="url(#rf)"/></mask></defs>`;
const rings=`<g mask="url(#rm)">${[84,132,180,228,276,324,372].map(r=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--cardline)" stroke-width="2"/>`).join('')}</g>`;
// the sweep covers the upper left, -149deg to -116deg, clear of the wordmark; the owl stays at the centre
const [x1,y1]=Pt(-116,520),[x2,y2]=Pt(-149,520);
const wedge=`<path d="M${cx} ${cy} L${x1} ${y1} L${x2} ${y2}Z" fill="var(--forest)" opacity=".13"/><path d="M${cx} ${cy} L${x1} ${y1}" stroke="var(--forest)" stroke-width="2.5" opacity=".7"/>`;
